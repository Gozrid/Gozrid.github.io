name: deploy pages

on:
  push:
    branches:
    - main
    paths:
    - "site/**"
    - "pictures/**"
    - ".github/workflows/pages.yaml"

  # allows to manually run the job at any time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # reuse the profile picture from the repo as avatar and favicon
      - name: copy assets
        run: cp "pictures/Profile Picture 1.png" site/avatar.png

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
